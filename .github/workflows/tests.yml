# Every push and pull request runs the full test suite on Windows and on
# Linux. A change made for one OS that breaks the other fails here.
#
# Both run the OS-layer tests (tools/run_tests.py --os): Windows on the
# runner's desktop, Linux on a virtual X server (Xvfb) with a small window
# manager (openbox), which gives the X11 OS layer real windows to find, focus,
# minimize and capture. Live input tests (--live) are not run in CI: they are
# meant for a real desktop with the real input stack.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Linux desktop packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox python3-tk \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tests (Windows desktop)
        if: runner.os == 'Windows'
        run: python tools/run_tests.py --os

      - name: Tests (Linux, Xvfb + openbox)
        if: runner.os == 'Linux'
        run: python tools/run_tests.py --os --xvfb
